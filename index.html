<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera Công Trình Live</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { margin: 0; padding: 0; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* Thanh điều khiển chọn Dự án & Địa chỉ ở trên cùng */
    .top-bar { background: rgba(0, 0, 0, 0.75); padding: 8px 10px; z-index: 10; border-bottom: 1px solid #333; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    .row:last-child { margin-bottom: 0; }
    select, input[type="text"] { flex: 1; padding: 8px 10px; font-size: 14px; border: 1px solid #555; border-radius: 6px; background: #222; color: #fff; outline: none; }
    .btn-sm { background: #444; color: #fff; border: none; border-radius: 6px; padding: 0 10px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn-add { background: #28a745; }
    .btn-search { background: #17a2b8; }

    /* Khung ngắm Camera trực tiếp */
    .viewfinder { position: relative; flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Hiệu ứng chớp màn hình khi bấm chụp */
    #flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 5; }

    /* Xem trước chữ đóng dấu trực tiếp trên màn hình ngắm */
    .live-watermark { position: absolute; bottom: 15px; left: 15px; right: 15px; pointer-events: none; text-shadow: 1px 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7); z-index: 4; }
    .wm-time-row { display: flex; align-items: center; gap: 10px; }
    .wm-time { font-size: 44px; font-weight: bold; line-height: 1; color: #fff; }
    .wm-divider { width: 3px; height: 38px; background: #FFD700; }
    .wm-date-col { font-size: 13px; font-weight: bold; line-height: 1.3; color: #fff; }
    .wm-project { font-size: 15px; font-weight: bold; color: #FFD700; margin-top: 4px; }
    .wm-location { font-size: 13px; color: #fff; margin-top: 2px; line-height: 1.3; }

    /* Hộp báo trạng thái tải ngầm góc trên phải */
    .queue-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 20px; font-size: 12px; border: 1px solid #555; z-index: 4; max-width: 70%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Cụm nút bấm chụp bên dưới */
    .bottom-bar { height: 100px; background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: space-around; padding: 0 20px; z-index: 10; border-top: 1px solid #333; }
    
    /* Nút chụp tròn kiểu máy ảnh (Chạm là chụp ngay) */
    .shutter-outer { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .shutter-inner { width: 58px; height: 58px; border-radius: 50%; background: #fff; transition: transform 0.08s, background 0.08s; }
    .shutter-outer:active .shutter-inner { transform: scale(0.88); background: #ccc; }

    .btn-cam-opt { background: #333; color: #fff; border: 1px solid #555; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- THANH CHỌN DỰ ÁN & ĐỊA CHỈ -->
  <div class="top-bar">
    <div class="row">
      <select id="projectSelect" onchange="onChangeProject(this.value)">
        <option value="">⏳ Đang tải dự án...</option>
      </select>
      <button class="btn-sm" onclick="loadProjects()">🔄</button>
      <button class="btn-sm btn-add" onclick="addNewProject()">➕ Dự án</button>
    </div>
    <div class="row">
      <input type="text" id="locationInput" placeholder="Gõ tên đường/xã rồi bấm 🔍..." oninput="onLocInput(this.value)">
      <button class="btn-sm btn-search" onclick="searchAddressByText()">🔍 Tìm</button>
      <button class="btn-sm" onclick="getRealGPS()">📍 GPS</button>
    </div>
  </div>

  <!-- MÀN HÌNH NGẮM CAMERA TRỰC TIẾP -->
  <div class="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>

    <!-- Trạng thái tải ngầm -->
    <div class="queue-badge" id="queueStatus">✅ Sẵn sàng chụp</div>

    <!-- Chữ đóng dấu hiển thị trực tiếp -->
    <div class="live-watermark">
      <div class="wm-time-row">
        <div class="wm-time" id="liveTime">00:00</div>
        <div class="wm-divider"></div>
        <div class="wm-date-col">
          <div id="liveDate">01 Tháng 1, 2026</div>
          <div id="liveDay">Thứ Hai</div>
        </div>
      </div>
      <div class="wm-project" id="liveProject">Dự án: Chưa chọn</div>
      <div class="wm-location" id="liveLocation">Đang lấy vị trí...</div>
    </div>
  </div>

  <!-- NÚT BẤM CHỤP LIÊN THANH -->
  <div class="bottom-bar">
    <button class="btn-cam-opt" onclick="switchCamera()">🔄 Đổi Cam</button>
    
    <!-- Chạm vào nút tròn này là chụp ngay lập tức, không qua bước xác nhận -->
    <div class="shutter-outer" onclick="snapPhoto()">
      <div class="shutter-inner"></div>
    </div>

    <!-- Nút dự phòng nếu mở bằng file:// bị trình duyệt chặn Live Camera -->
    <button class="btn-cam-opt" onclick="document.getElementById('fallbackInput').click()">📂 Chụp lẻ</button>
    <input type="file" id="fallbackInput" accept="image/*" capture="environment" style="display:none" onchange="fallbackProcess(event)">
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    // =========================================================================
    // DÁN ĐƯỜNG LINK WEB APP (GOOGLE APPS SCRIPT) CỦA BẠN VÀO DÒNG DƯỚI ĐÂY:
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbymIQ0uyS7TuBxHJ8vVaOqw05n-3Wk393yjiyFzgA2xjhiRQBruJP9tc1a9i5dm_9qU/exec";

    var video = document.getElementById("video");
    var currentFacingMode = "environment"; // Mặc định mở Camera sau
    var currentStream = null;
    var uploadQueue = [];
    var isUploading = false;

    window.onload = function() {
      updateClock();
      setInterval(updateClock, 1000);
      loadProjects(localStorage.getItem("last_project"));
      startLiveCamera();
      getRealGPS();
    };

    // --- 1. KHỞI ĐỘNG LIVE CAMERA TRỰC TIẾP TRÊN WEB ---
    function startLiveCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById("queueStatus").innerHTML = "⚠️ Hãy mở qua link https:// để bật Live Camera";
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      })
      .then(function(stream) {
        currentStream = stream;
        video.srcObject = stream;
      })
      .catch(function(err) {
        document.getElementById("queueStatus").innerHTML = "⚠️ Chưa cấp quyền Camera hoặc chưa dùng https://";
      });
    }

    function switchCamera() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      startLiveCamera();
    }

    // --- 2. CẬP NHẬT ĐỒNG HỒ & NHÃN TRỰC TIẾP TRÊN MÀN HÌNH ---
    function updateClock() {
      var now = new Date();
      var hours = String(now.getHours()).padStart(2, '0');
      var mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById("liveTime").innerText = hours + ":" + mins;
      document.getElementById("liveDate").innerText = now.getDate() + " Tháng " + (now.getMonth() + 1) + ", " + now.getFullYear();
      document.getElementById("liveDay").innerText = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"][now.getDay()];
    }

    function onLocInput(val) {
      document.getElementById("liveLocation").innerText = val || "Việt Nam";
      var proj = document.getElementById("projectSelect").value;
      if (proj) localStorage.setItem("loc_" + proj, val);
      localStorage.setItem("last_loc", val);
    }

    function onChangeProject(proj) {
      localStorage.setItem("last_project", proj);
      document.getElementById("liveProject").innerText = "Dự án: " + (proj || "Chưa chọn");
      var savedProjLoc = localStorage.getItem("loc_" + proj);
      if (savedProjLoc) {
        document.getElementById("locationInput").value = savedProjLoc;
        document.getElementById("liveLocation").innerText = savedProjLoc;
      }
    }

    // --- 3. BẤM CHỤP LIÊN THANH (0 GIÂY CHỜ, KHÔNG CẦN BẤM ENTER/OK) ---
    function snapPhoto() {
      var projectName = document.getElementById("projectSelect").value;
      if (!projectName) {
        alert("Vui lòng chọn hoặc bấm [➕ Dự án] ở góc trên trước khi chụp!");
        return;
      }

      if (!video.videoWidth) {
        // Nếu người dùng chưa mở qua https nên chưa có video live -> Gọi nút chụp dự phòng
        document.getElementById('fallbackInput').click();
        return;
      }

      // Hiệu ứng nháy màn hình báo đã chụp xong
      var flash = document.getElementById("flash");
      flash.style.opacity = 0.8;
      setTimeout(() => { flash.style.opacity = 0; }, 100);

      var canvas = document.getElementById("canvas");
      var ctx = canvas.getContext("2d");

      // Giữ kích thước chuẩn HD sắc nét
      var MAX_W = 1280;
      var scale = MAX_W / video.videoWidth;
      if (scale > 1) scale = 1;
      canvas.width = video.videoWidth * scale;
      canvas.height = video.videoHeight * scale;

      // Chụp ngay khung hình hiện tại từ ống kính
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Đóng dấu và đẩy vào hàng đợi tải ngầm
       stampAndQueue(canvas, ctx, projectName);
    }

    function stampAndQueue(canvas, ctx, projectName) {
      var locationStr = document.getElementById("locationInput").value.trim() || "Việt Nam";
      var fileName = projectName + "_" + new Date().getTime() + ".jpg";

      var timeStr = document.getElementById("liveTime").innerText;
      var dateStr = document.getElementById("liveDate").innerText;
      var dayOfWeek = document.getElementById("liveDay").innerText;

      ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      var startX = 30;
      ctx.font = "26px sans-serif";
      var locLines = wrapText(ctx, locationStr, canvas.width - 60);
      var extraHeight = (locLines.length - 1) * 34;
      var startY = canvas.height - 125 - extraHeight;

      // 1. Giờ cỡ lớn
      ctx.font = "bold 86px sans-serif";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(timeStr, startX, startY);
      var timeWidth = ctx.measureText(timeStr).width;

      // 2. Vạch kẻ dọc màu vàng
      ctx.shadowColor = "transparent"; 
      ctx.fillStyle = "#FFD700";
      ctx.fillRect(startX + timeWidth + 15, startY - 70, 5, 80);
      
      // 3. Ngày tháng & Thứ
      ctx.shadowColor = "rgba(0, 0, 0, 0.85)"; 
      ctx.font = "bold 26px sans-serif";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(dateStr, startX + timeWidth + 32, startY - 38);
      ctx.fillText(dayOfWeek, startX + timeWidth + 32, startY - 2);

      // 4. Tên Dự án
      ctx.font = "bold 30px sans-serif";
      ctx.fillStyle = "#FFD700"; 
      ctx.fillText("Dự án: " + projectName, startX, startY + 42);

      // 5. Vị trí chi tiết
      ctx.font = "25px sans-serif";
      ctx.fillStyle = "#FFFFFF";
      for (var i = 0; i < locLines.length; i++) {
        ctx.fillText(locLines[i], startX, startY + 82 + (i * 34));
      }

      var base64Data = canvas.toDataURL("image/jpeg", 0.78);
      addQueue(projectName, fileName, base64Data);
    }

    function wrapText(ctx, text, maxWidth) {
      var words = text.split(' ');
      var lines = [];
      var currentLine = words[0] || "";
      for (var i = 1; i < words.length; i++) {
        var word = words[i];
        if (ctx.measureText(currentLine + " " + word).width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    // --- 4. HÀNG ĐỢI ĐẨY ẢNH NGẦM LÊN DRIVE ---
    function addQueue(projectName, fileName, base64Data) {
      uploadQueue.push({ projectName: projectName, fileName: fileName, base64: base64Data });
      updateBadge();
      processQueue();
    }

    function updateBadge() {
      var badge = document.getElementById("queueStatus");
      if (uploadQueue.length === 0) {
        badge.innerHTML = "✅ Đã lưu hết lên Drive!";
      } else {
        badge.innerHTML = `🔄 Đang tải ngầm (${uploadQueue.length} ảnh)...`;
      }
    }

    function processQueue() {
      if (isUploading || uploadQueue.length === 0) return;
      isUploading = true;
      updateBadge();

      var currentItem = uploadQueue[0];

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "uploadPhoto",
          projectName: currentItem.projectName,
          fileName: currentItem.fileName,
          base64: currentItem.base64
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "OK") {
          uploadQueue.shift();
          isUploading = false;
          updateBadge();
          processQueue();
        } else {
          document.getElementById("queueStatus").innerHTML = "❌ Lỗi Drive: " + res.message;
          isUploading = false;
        }
      })
      .catch(() => {
        document.getElementById("queueStatus").innerHTML = "⏳ Mạng yếu, đang thử lại...";
        isUploading = false;
        setTimeout(processQueue, 3000);
      });
    }

    // --- 5. ĐỊA CHỈ & DỰ ÁN ---
    function searchAddressByText() {
      var locInput = document.getElementById("locationInput");
      var query = locInput.value.trim();
      if (!query) {
        query = prompt("Nhập tên đường, xã, hoặc khu vực:", "Cửa Lò, Nghệ An");
        if (!query) return;
      }
      locInput.value = "⏳ Đang tìm...";
      fetch(`${SCRIPT_URL}?action=searchAddress&query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
          var addr = (data && data.status === "OK" && data.address) ? data.address : query;
          locInput.value = addr;
          onLocInput(addr);
        })
        .catch(() => { locInput.value = query; onLocInput(query); });
    }

    function getRealGPS() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          fetch(`${SCRIPT_URL}?action=getAddress&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.status === "OK" && data.address) {
                document.getElementById("locationInput").value = data.address;
                onLocInput(data.address);
              }
            });
        },
        function() {
          var saved = localStorage.getItem("last_loc") || "Nghệ An";
          document.getElementById("locationInput").value = saved;
          document.getElementById("liveLocation").innerText = saved;
        },
        { enableHighAccuracy: true, timeout: 6000 }
      );
    }

    function loadProjects(selectVal) {
      var select = document.getElementById("projectSelect");
      fetch(SCRIPT_URL + "?action=getProjects")
        .then(res => res.json())
        .then(res => {
          select.innerHTML = "";
          var list = res.data || [];
          if (list.length === 0) {
            select.innerHTML = "<option value=''>⚠️ Bấm [➕ Dự án] bên cạnh</option>";
          } else {
            list.forEach(p => {
              var opt = document.createElement("option");
              opt.value = p; opt.text = p;
              select.appendChild(opt);
            });
            if (selectVal && list.includes(selectVal)) select.value = selectVal;
            onChangeProject(select.value);
          }
        });
    }

    function addNewProject() {
      var newName = prompt("1. Nhập tên dự án mới:");
      if (!newName || !newName.trim()) return;
      var cleanName = newName.trim();

      var initAddr = prompt("2. Nhập địa chỉ công trình này:", document.getElementById("locationInput").value);
      if (initAddr) {
        document.getElementById("locationInput").value = initAddr.trim();
        searchAddressByText();
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "createProject", projectName: cleanName })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "OK") loadProjects(res.created);
      });
    }

    function fallbackProcess(event) {
      var file = event.target.files[0];
      if (!file) return;
      var projectName = document.getElementById("projectSelect").value;
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.getElementById("canvas");
          var ctx = canvas.getContext("2d");
          var MAX_W = 1280;
          var scale = MAX_W / img.width;
          if (scale > 1) scale = 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          stampAndQueue(canvas, ctx, projectName);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }
  </script>
</body>
</html>
